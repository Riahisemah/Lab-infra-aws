name: Full DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Choose pipeline action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

# ============================================================
# GLOBAL ENV VARIABLES
# ============================================================
env:
  TERRAFORM_VERSION: "1.7.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}

# ============================================================
# JOB 1 — TERRAFORM
# ============================================================
jobs:
  terraform:
    name: "🚀 Terraform Infrastructure"
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    defaults:
      run:
        working-directory: terraform

    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
      alb_dns: ${{ steps.export.outputs.alb_dns }}

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # AWS Credentials
      # ======================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # Terraform Setup
      # ======================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # ======================================================
      # Terraform Init
      # ======================================================
      - name: Terraform Init
        run: terraform init

      # ======================================================
      # Terraform Format Check
      # ======================================================
      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      # ======================================================
      # Terraform Validate
      # ======================================================
      - name: Terraform Validate
        run: terraform validate

      # ======================================================
      # Terraform Plan
      # ======================================================
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="ec2_public_key=${{ secrets.EC2_PUBLIC_KEY }}" \
            -out=tfplan

      # ======================================================
      # Terraform Apply
      # ======================================================
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # ======================================================
      # Export Terraform Outputs
      # ======================================================
      - name: Export Outputs
        id: export
        run: |

          IPS=$(terraform output -json instance_public_ips \
            | jq -r '.[]' \
            | tr '\n' ',' \
            | sed 's/,$//')

          ALB=$(terraform output -raw alb_dns_name)

          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT
          echo "alb_dns=$ALB" >> $GITHUB_OUTPUT

          echo "======================================"
          echo "✅ EC2 Instances: $IPS"
          echo "✅ Load Balancer : $ALB"
          echo "======================================"

  # ============================================================
  # JOB 2 — ANSIBLE DEPLOYMENT
  # ============================================================

  ansible:
    name: "⚙️ Configure & Deploy Application"
    runs-on: ubuntu-latest

    needs: terraform

    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # Install Dependencies
      # ======================================================
      - name: Install Ansible Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ansible \
            jq \
            rsync \
            python3-pip

          pip3 install boto3 botocore

      # ======================================================
      # Configure SSH
      # ======================================================
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      # ======================================================
      # Wait EC2 Instances
      # ======================================================
      - name: Wait for EC2 SSH Access
        run: |

          IPS="${{ needs.terraform.outputs.instance_ips }}"

          echo "Checking SSH connectivity..."

          for ip in $(echo "$IPS" | tr ',' ' '); do

            echo "Waiting for $ip..."

            for i in {1..20}; do

              if ssh \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 \
                -i ~/.ssh/deploy_key \
                ec2-user@$ip "echo connected" 2>/dev/null
              then
                echo "✅ $ip reachable"
                break
              fi

              echo "Retry $i/20..."
              sleep 15
            done
          done

      # ======================================================
      # Generate Inventory
      # ======================================================
      - name: Generate Ansible Inventory
        run: |

          IPS="${{ needs.terraform.outputs.instance_ips }}"

          cat > ansible/inventory.ini <<EOF
          [web]
          EOF

          for ip in $(echo "$IPS" | tr ',' ' '); do
            echo "$ip ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/deploy_key" \
              >> ansible/inventory.ini
          done

          cat >> ansible/inventory.ini <<EOF

          [web:vars]
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          echo "======================================"
          cat ansible/inventory.ini
          echo "======================================"

      # ======================================================
      # Bootstrap Python
      # ======================================================
      - name: Bootstrap Python
        run: |
          ansible web \
            -i ansible/inventory.ini \
            -m raw \
            -a "sudo yum install -y python3" \
            --timeout=30
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      # ======================================================
      # Test Connectivity
      # ======================================================
      - name: Test Ansible Connectivity
        run: |
          ansible web \
            -i ansible/inventory.ini \
            -m ping
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      # ======================================================
      # Deploy Application
      # ======================================================
      - name: Run Deployment Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      # ======================================================
      # Deployment Success
      # ======================================================
      - name: Display Application URL
        run: |
          echo ""
          echo "======================================"
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo ""
          echo "🌍 Application URL:"
          echo "http://${{ needs.terraform.outputs.alb_dns }}"
          echo ""
          echo "⏳ ALB health checks may take 1-2 mins"
          echo "======================================"

  # ============================================================
  # JOB 3 — DESTROY INFRASTRUCTURE
  # ============================================================

  destroy:
    name: "🔥 Destroy Infrastructure"
    runs-on: ubuntu-latest

    if: github.event.inputs.action == 'destroy'

    defaults:
      run:
        working-directory: terraform

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # AWS Credentials
      # ======================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # Setup Terraform
      # ======================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # ======================================================
      # Terraform Init
      # ======================================================
      - name: Terraform Init
        run: terraform init

      # ======================================================
      # Terraform Destroy
      # ======================================================
      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="ec2_public_key=dummy" \
            -auto-approve

      # ======================================================
      # Success Message
      # ======================================================
      - name: Confirm Destruction
        run: |
          echo "======================================"
          echo "🔥 Infrastructure Destroyed Successfully"
          echo "======================================"
