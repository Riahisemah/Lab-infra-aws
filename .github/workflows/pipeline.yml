name: Full DevOps Pipeline

# ============================================================
# Triggers
# ============================================================
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy

# ============================================================
# JOB 1 — Terraform: provision AWS infrastructure
# ============================================================
jobs:
  terraform:
    name: "1. Provision Infrastructure"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    defaults:
      run:
        working-directory: terraform

    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
      alb_dns: ${{ steps.export.outputs.alb_dns }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="ec2_public_key=${{ secrets.EC2_PUBLIC_KEY }}" \
            -out=tfplan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      # -------------------------------------------------------
      # Cleanup any leftover resources from previous failed runs
      # so Terraform can create them fresh without conflicts
      # -------------------------------------------------------
      - name: Cleanup conflicting AWS resources
        run: |
          # Delete ALB listener first (so TG can be deleted)
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "ecommerce-lab-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || echo "None")
          if [ "$ALB_ARN" != "None" ] && [ ! -z "$ALB_ARN" ]; then
            echo "🗑️  Deleting ALB listeners..."
            LISTENER_ARNS=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[].ListenerArn' \
              --output text 2>/dev/null || echo "")
            for L in $LISTENER_ARNS; do
              aws elbv2 delete-listener --listener-arn "$L"
            done

            echo "🗑️  Deleting ALB..."
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
            aws elbv2 wait load-balancers-deleted --load-balancer-arns "$ALB_ARN"
            echo "✅ ALB deleted"
          fi

          # Now safe to delete Target Group
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "ecommerce-lab-tg" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || echo "None")
          if [ "$TG_ARN" != "None" ] && [ ! -z "$TG_ARN" ]; then
            echo "🗑️  Deleting Target Group..."
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN"
            echo "✅ Target Group deleted"
          fi

          # Delete Key Pair
          aws ec2 delete-key-pair --key-name "ecommerce-lab-key" 2>/dev/null || true
          echo "✅ Key Pair deleted (if existed)"

          # Terminate EC2 instances
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ecommerce-lab-web-*" \
              "Name=instance-state-name,Values=running,stopped,pending" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text 2>/dev/null || echo "")
          if [ ! -z "$INSTANCE_IDS" ]; then
            echo "🗑️  Terminating EC2 instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
            echo "✅ EC2 instances terminated"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export outputs for Ansible
        id: export
        run: |
          IPS=$(terraform output -json instance_public_ips \
            | jq -r '.[]' \
            | tr '\n' ',' \
            | sed 's/,$//')
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT

          ALB=$(terraform output -raw alb_dns_name)
          echo "alb_dns=$ALB" >> $GITHUB_OUTPUT

          echo "✅ EC2 IPs: $IPS"
          echo "✅ ALB DNS: $ALB"

  # ============================================================
  # JOB 2 — Ansible: configure servers & deploy app
  # ============================================================
  ansible:
    name: "2. Configure & Deploy App"
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq python3-pip rsync
          pip3 install boto3 botocore

      - name: Setup SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Wait for EC2 instances to be ready
        run: |
          IPS="${{ needs.terraform.outputs.instance_ips }}"
          if [ -z "$IPS" ]; then
            echo "❌ No IPs received from Terraform!"
            exit 1
          fi
          echo "Waiting for SSH on: $IPS"
          for ip in $(echo "$IPS" | tr ',' ' '); do
            echo "Checking $ip..."
            READY=false
            for i in $(seq 1 20); do
              if ssh -o StrictHostKeyChecking=no \
                     -o ConnectTimeout=5 \
                     -i ~/.ssh/deploy_key \
                     ec2-user@$ip "echo ready" 2>/dev/null; then
                echo "✅ $ip is ready"
                READY=true
                break
              fi
              echo "  Attempt $i/20 — retrying in 15s..."
              sleep 15
            done
            if [ "$READY" = false ]; then
              echo "❌ Could not reach $ip after 20 attempts"
              exit 1
            fi
          done

      - name: Generate Ansible inventory
        run: |
          IPS="${{ needs.terraform.outputs.instance_ips }}"
          echo "[web]" > ansible/inventory.ini
          for ip in $(echo "$IPS" | tr ',' ' '); do
            echo "$ip ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/deploy_key" \
              >> ansible/inventory.ini
          done
          echo "" >> ansible/inventory.ini
          echo "[web:vars]" >> ansible/inventory.ini
          echo "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

          echo "Generated inventory:"
          cat ansible/inventory.ini

      - name: Test Ansible connectivity
        run: |
          ansible web \
            -i ansible/inventory.ini \
            -m ping \
            --timeout=30
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Run deployment playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: ansible/ansible.cfg

      - name: Print app URL
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚀 Deployment complete!                         ║"
          echo "║                                                  ║"
          echo "║  App URL: http://${{ needs.terraform.outputs.alb_dns }}"
          echo "║                                                  ║"
          echo "║  Note: ALB may take 1-2 min for health checks   ║"
          echo "╚══════════════════════════════════════════════════╝"

  # ============================================================
  # JOB 3 — Destroy (manual trigger only)
  # ============================================================
  destroy:
    name: "3. Destroy Infrastructure"
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="ec2_public_key=placeholder" \
            -auto-approve
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Confirm destruction
        run: echo "✅ All AWS resources have been destroyed. No more charges."
