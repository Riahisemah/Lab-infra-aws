version: '3.8'

services:

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  app:
    build: ./app
    container_name: nodeapp
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/ecommerce
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
